name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: swift build

      - name: Validate integration resources
        run: |
          node --check Resources/Integrations/opencode-vibebreak.js
          node --check Resources/Integrations/amp-vibebreak.js
          sh -n Scripts/build-app.sh
          sh -n Scripts/install.sh
          sh -n Scripts/test.sh
          sh -n Scripts/uninstall.sh
          plutil -lint Resources/Info.plist Resources/LaunchAgent.plist

      - name: Test
        run: make test

      - name: Build application bundle
        run: ./Scripts/build-app.sh

      - name: Verify application contents
        run: |
          test -x dist/VibeBreak.app/Contents/MacOS/VibeBreak
          test -x dist/VibeBreak.app/Contents/MacOS/vibebreak-bridge-emit
          test -f dist/VibeBreak.app/Contents/Resources/Integrations/opencode-vibebreak.js
          test -f dist/VibeBreak.app/Contents/Resources/Integrations/amp-vibebreak.js

      - name: Archive application bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/VibeBreak.app dist/VibeBreak.zip

      - name: Upload application bundle
        uses: actions/upload-artifact@v4
        with:
          name: VibeBreak
          path: dist/VibeBreak.zip
