name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate integration resources
        run: |
          node --check Resources/Integrations/opencode-vibebreak.js
          node --check Resources/Integrations/amp-vibebreak.js
          sh -n Scripts/build-app.sh
          sh -n Scripts/install.sh
          sh -n Scripts/test.sh
          sh -n Scripts/uninstall.sh
          plutil -lint Resources/Info.plist Resources/LaunchAgent.plist

      - name: Test
        run: make test

      - name: Build application bundle
        run: ./Scripts/build-app.sh

      - name: Verify application contents
        run: |
          test -x dist/VibeBreak.app/Contents/MacOS/VibeBreak
          test -x dist/VibeBreak.app/Contents/MacOS/vibebreak-bridge-emit
          test -f dist/VibeBreak.app/Contents/Resources/Integrations/opencode-vibebreak.js
          test -f dist/VibeBreak.app/Contents/Resources/Integrations/amp-vibebreak.js
          lipo -verify_arch arm64 x86_64 dist/VibeBreak.app/Contents/MacOS/VibeBreak
          lipo -verify_arch arm64 x86_64 dist/VibeBreak.app/Contents/MacOS/vibebreak-bridge-emit
          codesign --verify --deep --strict --all-architectures dist/VibeBreak.app
          cd dist
          shasum -a 256 -c SHA256SUMS

      - name: Upload application bundle
        uses: actions/upload-artifact@v4
        with:
          name: VibeBreak-unsigned-alpha
          if-no-files-found: error
          path: |
            dist/VibeBreak.zip
            dist/VibeBreak.dmg
            dist/SHA256SUMS
