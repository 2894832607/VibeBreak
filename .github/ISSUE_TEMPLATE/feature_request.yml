name: Feature request
description: Propose an agent integration or automation behavior.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow problem rather than only the proposed UI.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Lifecycle contract
      description: Link official start, completion, interruption, or status event documentation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
      description: Define observable inputs, outputs, and failure semantics.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This does not require parsing prompt or response content.
          required: true
        - label: This does not depend on inactivity timeout inference.
          required: true
