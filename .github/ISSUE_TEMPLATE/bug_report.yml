name: Bug report
description: Report incorrect lifecycle detection or application switching.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: source
    attributes:
      label: Agent source
      options:
        - Codex Desktop
        - Claude Code
        - Cursor
        - Gemini CLI
        - OpenCode
        - Amp
        - Trae / custom Bridge
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: VibeBreak, macOS, and agent versions.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Actual behavior
      description: Include the action, observed result, and timing.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste VibeBreak diagnostics. Remove prompt or response content.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed prompts, responses, credentials, and private source files.
          required: true
